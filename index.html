<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>술과 담배 — 바다거북 스프 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="stars" id="stars" aria-hidden="true"></div>

  <main class="wrap">

    <header class="hero">
      <p class="eyebrow">바다거북 스프 · 추리 퀴즈</p>
      <h1 class="title">Q. 술과 담배</h1>
      <p class="intro">
        한 남자가 술을 마시다가 갑자기 구토를 하였습니다.<br>
        이어서 담배를 피우려다 죽고 말았습니다.
      </p>
      <p class="intro-sub">어떻게 된 것일까요?</p>
    </header>

    <section class="stage" aria-label="고양이에게 질문하기">

      <div class="stage-inner">

        <div class="bubble-slot" id="bubbleSlot">
          <div class="bubble bubble-placeholder" id="bubble">
            <p class="bubble-q" id="bubbleQ">말풍선을 눌러 질문을 골라보세요</p>
            <p class="bubble-a" id="bubbleA" hidden></p>
          </div>
        </div>

        <button class="cat-btn" id="catBtn" aria-label="질문하기">
          <canvas id="catCanvas" width="360" height="360"></canvas>
          <img id="catSource" src="assets/cat.jpg" alt="" hidden>
        </button>

      </div>

      <div class="controls">
        <button class="ask-btn" id="askBtn">
          <span>질문하기</span>
        </button>
        <p class="hint" id="hint">예 · 아니오 · 중요하지 않습니다 로만 답합니다</p>
      </div>

    </section>

    <section class="log-section" aria-label="지금까지 물어본 질문">
      <div class="log-head">
        <span>질문 기록</span>
        <span class="log-count" id="logCount">0</span>
      </div>
      <ol class="log" id="log"></ol>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
