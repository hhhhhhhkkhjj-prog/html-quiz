<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>추리 데모 — 우주 고양이 (사용자 이미지)</title>
  <!-- 구글 폰트는 선택사항입니다. 인터넷 연결이 없으면 시스템 폰트가 사용됩니다. -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app" aria-label="바다거북 스프 추리 데모">
    <header class="topbar">
      <h1>추리 퀴즈 — 우주 고양이 출제자</h1>
      <p class="notice">주의: 이 이야기는 사망/자살 관련 민감한 내용을 포함합니다.</p>
    </header>

    <section class="board" role="application">
      <aside class="left">
        <div class="space-box" id="spaceBox" aria-hidden="false">
          <div class="cat" id="cat" role="button" tabindex="0" aria-label="고양이 말풍선을 클릭해 질문을 꺼내세요">
            <!-- 사용자 이미지(cat.png)를 사용합니다 -->
            <img src="cat.png" alt="출제자 고양이" id="catImg" ondragstart="return false;">
            <div class="bubble" id="bubble" aria-live="polite">말풍선을 클릭해 질문을 꺼내세요</div>
          </div>
        </div>

        <div class="controls">
          <button id="nextBtn" class="btn primary">다음 질문</button>
          <button id="shuffleBtn" class="btn">셔플</button>
          <button id="resetBtn" class="btn">리셋</button>
          <button id="toggleListBtn" class="btn">문항 목록 보기/숨기기</button>
        </div>
      </aside>

      <main class="right" aria-live="polite">
        <section class="panel log" id="logPanel">
          <div class="panel-head">질문 · 답 로그 (최근)</div>
          <div id="log" class="panel-body" tabindex="0"></div>
        </section>

        <section class="panel bank" id="bankPanel" style="display:none;">
          <div class="panel-head">문항 은행 (교사용)</div>
          <div id="bank" class="panel-body"></div>
        </section>
      </main>
    </section>

    <footer class="foot">
      <small>이미지 교체: space.jpg, cat.png 파일을 이 폴더에 넣으세요. (투명 배경의 cat.png 권장)</small>
    </footer>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
