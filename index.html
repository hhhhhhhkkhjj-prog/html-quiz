<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우주 고양이 퀴즈</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="stars"></div>
    
    <div class="container">
        <div class="header">
            <div class="cat">🐱</div>
            <h1>우주 고양이의 HTML 퀴즈</h1>
        </div>

        <div id="quiz-container">
            <div class="progress-bar">
                <div id="progress" class="progress-fill"></div>
            </div>
            <p class="progress-text">문제 <span id="current-question">1</span>/10</p>

            <div id="question-box" class="question-box">
                <h2 id="question-text"></h2>
                <div id="options" class="options"></div>
            </div>

            <div class="button-group">
                <button id="prev-btn" class="btn btn-secondary" onclick="prevQuestion()">이전</button>
                <button id="next-btn" class="btn btn-primary" onclick="nextQuestion()">다음</button>
            </div>
        </div>

        <div id="result-container" class="result-container hidden">
            <div class="result-content">
                <div class="result-cat">😺</div>
                <h2>퀴즈 완료!</h2>
                <p class="result-score">점수: <span id="score"></span>/100</p>
                <div id="result-details" class="result-details"></div>
                <button class="btn btn-primary" onclick="restartQuiz()">다시 풀기</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
