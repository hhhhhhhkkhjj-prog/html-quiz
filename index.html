<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>커밋 챌린지 — HTML 퀴즈 게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">

  <header class="top">
    <p class="eyebrow">$ git log --quiz</p>
    <h1>커밋 챌린지</h1>
    <p class="sub">HTML 퀴즈 게임 만들기 &amp; 깃허브 배포, 10개의 커밋으로 점검해보세요</p>
  </header>

  <main class="board">

    <!-- 커밋 그래프 -->
    <nav class="graph" id="graph" aria-label="진행 상황"></nav>

    <!-- 퀴즈 카드 -->
    <section class="card" id="quizCard">
      <div class="card-head">
        <span class="commit-tag" id="commitTag">commit 1/10</span>
        <span class="score-tag" id="scoreTag">score 0</span>
      </div>

      <h2 class="question" id="question"></h2>

      <div class="options" id="options"></div>

      <p class="feedback" id="feedback"></p>

      <button class="next-btn" id="nextBtn" disabled>다음 커밋 →</button>
    </section>

    <!-- 결과 화면 -->
    <section class="card result" id="resultCard" hidden>
      <p class="eyebrow">$ git push origin main</p>
      <h2 class="deploy-title" id="deployTitle">🚀 Deploy 성공</h2>
      <p class="deploy-score" id="deployScore"></p>

      <ul class="commit-log" id="commitLog"></ul>

      <button class="next-btn" id="restartBtn">다시 도전하기 ↺</button>
    </section>

  </main>

  <footer class="foot">
    <p>정답을 맞히면 커밋이 초록색으로, 틀리면 산호색으로 그래프에 기록돼요.</p>
  </footer>

</div>

<script src="script.js"></script>
</body>
</html>
